# The stand-in example: an agent with a tool that moves money. `poisson-break init --example
# stand-in` wrote this file, the agent (refund_desk.py), the stand-in for its write tool
# (payments_fake.py) and the cases (cases.jsonl).
version = 1

[target]
kind = "rollout"
entry = "refund_desk:refund_desk"
cases = "cases.jsonl"

[tools]
lookup_order = "read"
# A write tool is refused until its line says how it is made safe to repeat. Here a stand-in
# is called in its place in every run, so no run moves money.
issue_refund = { class = "write", stand_in = "payments_fake:issue_refund" }

[fails]
checks = ["crashed", "hung", "duplicate_write"]

[vary]
tools = ["error", "timeout", "lost_reply"]
inputs = []
max_call = 1

[search]
strategy = "screen"
runs = 120
control_repeats = 2
cases_per_condition = 3
seed = 7

[confirm]
candidates = 3
repeats = 3

[output]
folder = "break-runs"
