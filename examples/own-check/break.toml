# The own-check example: a failure only the team's own rule can see. `poisson-break init
# --example own-check` wrote this file, the agent (desk.py), the check (checks.py) and the cases
# (cases.jsonl).
version = 1

[target]
kind = "rollout"
entry = "desk:order_desk"
cases = "cases.jsonl"

[tools]
lookup_order = "read"

[fails]
own = "checks:made_up_answer"       # your own check: a function Break calls with each run

[vary]
tools = ["error", "timeout", "rate_limited", "empty"]
inputs = []
max_call = 1

[search]
strategy = "screen"
runs = 120
control_repeats = 2
cases_per_condition = 3
seed = 7

[confirm]
candidates = 3
repeats = 3

[output]
folder = "break-runs"
