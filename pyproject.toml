[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poisson-break"
dynamic = ["version"]
description = "Finds where an AI agent fails: runs the agent you already have, many times, while changing what the user asks, how the tools behave and how the conversation goes, and keeps the conditions that fail more than a control."
readme = "README.md"
# An SPDX expression, so PyPI shows "MIT" and not the licence text; the two files ship under
# dist-info/licenses/: LICENSE and the third-party NOTICE.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
maintainers = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
keywords = ["agents", "fault-injection", "evaluation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Prove and Trace are real dependencies, each pinned exactly. Break's Prove is the version Trace
# pins, so the three tools agree on one Prove; Break pins Trace exactly because it reads a named
# JSON schema from Trace's command. Trace 0.1.0a1 is a pre-release on PyPI and pins
# poisson-prove==0.1.3; pip takes an exact `==` pin on a pre-release without `--pre`.
#
# Rich draws what the command prints on a terminal, questionary asks its menus there, and
# prompt_toolkit, which questionary is built on, puts a menu on stderr. All three are ordinary
# dependencies, not an extra: Break is pretty on a terminal from a plain install. Floors, not
# pins, and each one measured: the look's tests pass on Rich 14.2.0, which is the floor Trace
# declares, and on 15.0.0, with questionary 2.1.1 on prompt_toolkit 3.0.53. Nothing below them
# is claimed.
dependencies = [
    "poisson-prove==0.1.3",
    "poisson-trace==0.1.0a1",
    "rich>=14.2.0",
    "questionary>=2.1.1",
    "prompt_toolkit>=3.0.53",
]

[project.optional-dependencies]
# Floors, not pins: the suite, mypy --strict and the ruff rule set in this file are known green on
# these versions, and nothing below them is claimed. hatchling is here because the wheel's own
# test builds it from the working tree, and the clean-install script does the same.
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    "hatchling>=1.27.0",
    # pyte reads a pseudo-terminal's screen back for the look's tests
    "pyte>=0.8.2",
]

# The command: `poisson-break`, one script (`python -m poisson_break` is the same). `main` takes
# `prog`, so a shared `poisson break` can come later without touching Break.
[project.scripts]
poisson-break = "poisson_break.cli:main"

[project.urls]
Homepage = "https://github.com/poisson-labs/break"
Repository = "https://github.com/poisson-labs/break"
Issues = "https://github.com/poisson-labs/break/issues"

# One version, declared once, in the package: `poisson_break.__version__`.
[tool.hatch.version]
path = "src/poisson_break/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/poisson_break"]

# The examples ride in the wheel, inside the package, so `poisson-break init --example NAME`
# writes one from an install with no checkout and no network: each folder under examples/ that
# holds a break.toml, put at poisson_break/examples/<name>/. A new example is a new line here;
# tests/test_release_init_example.py fails on one that is missing.
[tool.hatch.build.targets.wheel.force-include]
"examples/desk" = "poisson_break/examples/desk"
"examples/full-loop" = "poisson_break/examples/full-loop"
"examples/stand-in" = "poisson_break/examples/stand-in"
"examples/own-check" = "poisson_break/examples/own-check"
"examples/own-fault" = "poisson_break/examples/own-fault"

# The sdist holds the source, the tests, the docs, the examples and the scripts, and the files
# named here: nothing else of a checkout. Hatchling adds PKG-INFO and the repository's
# .gitignore to every sdist itself.
[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "docs", "examples", "scripts",
    "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "E731", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import `tests.conftest`, which needs the repository root on the import path.
# `python -m pytest` puts it there and a bare `pytest` does not; this does, for both.
pythonpath = ["."]
